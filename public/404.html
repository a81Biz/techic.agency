<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Redirigiendo…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
</head>
<body>
  <p>Redirigiendo a la app…</p>
  <script>
    // Redirige a index preservando query/hash, compatible con subcarpetas
    var p = location.pathname.replace(/\/404\.html?$/, '/');
    var dest = location.origin + p + '#/';
    location.replace(dest + location.search + location.hash);
  </script>
  <noscript>
    <a href="./#/">Ir a Home</a>
  </noscript>
</body>
</html>
